<svg viewBox="0 0 1060 1000" width="1060" height="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<title>Activity Diagram — Kiekje plaatsen</title>
<defs>
  <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8378"/></marker>
  <marker id="pijl-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker>
  <marker id="erft" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#14120F" stroke="#8A8378" stroke-width="1.2"/></marker>
  <marker id="ruit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,6 L6,1 L12,6 L6,11 z" fill="#1F1C18" stroke="#8A8378"/></marker>
</defs>
<rect width="1060" height="1000" fill="#14120F"/>
<text x="30" y="40" fill="#F5F1EA" font-size="22" font-weight="700" font-family="Georgia,serif">Activity Diagram — Kiekje plaatsen</text>
<text x="30" y="62" fill="#8A8378" font-size="12.5">Van klik tot post in de feed, per onderdeel (swimlanes)</text>
<rect x="30" y="80" width="250" height="900" fill="#16130F" stroke="#4A433A"/><text x="155" y="104" fill="#E8A33D" font-size="13" font-weight="700" text-anchor="middle">Gebruiker</text><rect x="280" y="80" width="250" height="900" fill="#181511" stroke="#4A433A"/><text x="405" y="104" fill="#E8A33D" font-size="13" font-weight="700" text-anchor="middle">Browser (frontend/js)</text><rect x="530" y="80" width="250" height="900" fill="#16130F" stroke="#4A433A"/><text x="655" y="104" fill="#E8A33D" font-size="13" font-weight="700" text-anchor="middle">Server (PostController)</text><rect x="780" y="80" width="250" height="900" fill="#181511" stroke="#4A433A"/><text x="905" y="104" fill="#E8A33D" font-size="13" font-weight="700" text-anchor="middle">Opslag</text><circle cx="155" cy="135" r="10" fill="#F5F1EA"/><rect x="55" y="160" width="200" height="40" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="155" y="184" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Klikt op &quot;Maken&quot; (＋)</text><rect x="305" y="225" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="405" y="244" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Opent venster</text><text x="405" y="258" fill="#F5F1EA" font-size="11.5" text-anchor="middle">&quot;Nieuw kiekje&quot;</text><rect x="55" y="300" width="200" height="40" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="155" y="324" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Kiest een foto</text><rect x="305" y="365" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="405" y="384" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Foto verkleinen (max. 1080px)</text><text x="405" y="398" fill="#F5F1EA" font-size="11.5" text-anchor="middle">+ voorbeeld tonen</text><rect x="55" y="440" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="155" y="459" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Typt bijschrift + locatie,</text><text x="155" y="473" fill="#F5F1EA" font-size="11.5" text-anchor="middle">klikt &quot;Plaatsen&quot;</text><rect x="305" y="515" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="405" y="534" fill="#F5F1EA" font-size="11.5" text-anchor="middle">POST posts.php</text><text x="405" y="548" fill="#F5F1EA" font-size="11.5" text-anchor="middle">{ image, caption, location }</text><path d="M655 590 l70 26 l-70 26 l-70 -26 z" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><text x="655" y="620" fill="#F5F1EA" font-size="11" text-anchor="middle">Ingelogd?</text><path d="M655 680 l70 26 l-70 26 l-70 -26 z" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><text x="655" y="710" fill="#F5F1EA" font-size="11" text-anchor="middle">Echte afbeelding?</text><rect x="805" y="770" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="905" y="789" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Foto opslaan in</text><text x="905" y="803" fill="#F5F1EA" font-size="11.5" text-anchor="middle">backend/uploads/</text><rect x="805" y="840" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="905" y="859" fill="#F5F1EA" font-size="11.5" text-anchor="middle">INSERT INTO posts</text><text x="905" y="873" fill="#F5F1EA" font-size="11.5" text-anchor="middle">(prepared statement)</text><rect x="305" y="840" width="200" height="44" rx="18" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="405" y="859" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Post bovenaan feed</text><text x="405" y="873" fill="#F5F1EA" font-size="11.5" text-anchor="middle">tonen</text><rect x="305" y="620" width="200" height="44" rx="18" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><text x="405" y="639" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Melding &quot;Je bent</text><text x="405" y="653" fill="#F5F1EA" font-size="11.5" text-anchor="middle">uitgelogd&quot; → inlogscherm</text><rect x="305" y="700" width="200" height="44" rx="18" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><text x="405" y="719" fill="#F5F1EA" font-size="11.5" text-anchor="middle">Melding &quot;Bestand is geen</text><text x="405" y="733" fill="#F5F1EA" font-size="11.5" text-anchor="middle">geldige afbeelding&quot;</text><path d="M155 145 V160" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M155 200 V212.5 H405 V225" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M405 269 V284.5 H155 V300" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M155 340 V352.5 H405 V365" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M405 409 V424.5 H155 V440" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M155 484 V499.5 H405 V515" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M405 559 V574.5 H655 V590" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M655 642 V680" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><rect x="666.12" y="649.5" width="21.76" height="16.5" rx="4" fill="#14120F"/><text x="677" y="661" fill="#8A8378" font-size="10.5" text-anchor="middle">ja</text><path d="M585 616 H505 " fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><rect x="531.54" y="598.5" width="62.92" height="16.5" rx="4" fill="#14120F"/><text x="563" y="610" fill="#8A8378" font-size="10.5" text-anchor="middle">nee (401)</text><path d="M585 706 H505" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><rect x="531.54" y="688.5" width="62.92" height="16.5" rx="4" fill="#14120F"/><text x="563" y="700" fill="#8A8378" font-size="10.5" text-anchor="middle">nee (422)</text><path d="M655 732 V751 H905 V770" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><rect x="709.12" y="745.5" width="21.76" height="16.5" rx="4" fill="#14120F"/><text x="720" y="757" fill="#8A8378" font-size="10.5" text-anchor="middle">ja</text><path d="M905 814 V840" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M805 862 H505" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><rect x="611.78" y="846.5" width="86.44000000000001" height="16.5" rx="4" fill="#14120F"/><text x="655" y="858" fill="#8A8378" font-size="10.5" text-anchor="middle">JSON met post</text><path d="M405 884 V906" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><circle cx="405" cy="918" r="11" fill="none" stroke="#F5F1EA" stroke-width="2"/><circle cx="405" cy="918" r="6" fill="#F5F1EA"/>
</svg>

<svg viewBox="0 0 1170 690" width="1170" height="690" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<title>Architectuur — Kiekje</title>
<defs>
  <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8378"/></marker>
  <marker id="pijl-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker>
  <marker id="erft" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#14120F" stroke="#8A8378" stroke-width="1.2"/></marker>
  <marker id="ruit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,6 L6,1 L12,6 L6,11 z" fill="#1F1C18" stroke="#8A8378"/></marker>
</defs>
<rect width="1170" height="690" fill="#14120F"/>
<text x="30" y="40" fill="#F5F1EA" font-size="22" font-weight="700" font-family="Georgia,serif">Architectuur — Kiekje</text>
<text x="30" y="62" fill="#8A8378" font-size="12.5">Hoe frontend, API, database en bestandsopslag samenwerken</text>
<rect x="40" y="90" width="340" height="420" rx="10" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="56" y="116" fill="#E8A33D" font-size="14" font-weight="700">Browser  (frontend/)</text><text x="56" y="140" fill="#F5F1EA" font-size="11.5">index.html  laadt stijl + scripts</text><text x="56" y="158" fill="#F5F1EA" font-size="11.5">css/style.css</text><text x="56" y="176" fill="#F5F1EA" font-size="11.5">js/  18 scripts, één per onderdeel:</text><text x="56" y="194" fill="#8A8378" font-size="11.5">  state, api, utils, session, navigation,</text><text x="56" y="212" fill="#8A8378" font-size="11.5">  posts, feed, stories, profile,</text><text x="56" y="230" fill="#8A8378" font-size="11.5">  messages, notifications, layout,</text><text x="56" y="248" fill="#8A8378" font-size="11.5">  modals, events, auth, icons, main</text><text x="56" y="266" fill="#F5F1EA" font-size="11.5">js/search.js  →  React-component</text><text x="56" y="284" fill="#8A8378" font-size="11.5">  (SearchPage, UserRow, Avatar)</text><text x="56" y="302" fill="#F5F1EA" font-size="11.5">vendor/  React 18, ReactDOM, htm</text><text x="56" y="320" fill="#F5F1EA" font-size="11.5"></text><text x="56" y="338" fill="#F5F1EA" font-size="11.5">localStorage: alleen UI-voorkeuren</text><text x="56" y="356" fill="#8A8378" font-size="11.5">  (laatste tabblad, gelezen meldingen)</text><rect x="470" y="90" width="320" height="300" rx="10" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><text x="486" y="116" fill="#D9667A" font-size="14" font-weight="700">Server  (backend/, PHP OOP)</text><text x="486" y="140" fill="#F5F1EA" font-size="11.5">api/*.php   ingangen: starten één controller</text><text x="486" y="158" fill="#F5F1EA" font-size="11.5"></text><text x="486" y="176" fill="#F5F1EA" font-size="11.5">src/Controllers/   één klasse per onderdeel</text><text x="486" y="194" fill="#8A8378" font-size="11.5">  Auth, Post, Interaction, Story, Follow,</text><text x="486" y="212" fill="#8A8378" font-size="11.5">  User, Message, Notification</text><text x="486" y="230" fill="#8A8378" font-size="11.5">  (erven van abstract Controller)</text><text x="486" y="248" fill="#F5F1EA" font-size="11.5">src/Repositories/  alle SQL (erven van</text><text x="486" y="266" fill="#8A8378" font-size="11.5">  abstract Repository) + LikeTable</text><text x="486" y="284" fill="#F5F1EA" font-size="11.5">src/Core/   Request, Response, Session,</text><text x="486" y="302" fill="#8A8378" font-size="11.5">  Database, ImageStorage, Validator</text><rect x="880" y="90" width="250" height="190" rx="10" fill="#1F1C18" stroke="#6E9887" stroke-width="1.5"/><text x="896" y="116" fill="#6E9887" font-size="14" font-weight="700">MySQL  (database kiekje)</text><text x="896" y="140" fill="#F5F1EA" font-size="11.5">users, posts, comments,</text><text x="896" y="158" fill="#F5F1EA" font-size="11.5">likes, comment_likes,</text><text x="896" y="176" fill="#F5F1EA" font-size="11.5">follows, messages,</text><text x="896" y="194" fill="#F5F1EA" font-size="11.5">stories, story_likes</text><text x="896" y="212" fill="#F5F1EA" font-size="11.5"></text><text x="896" y="230" fill="#8A8378" font-size="11.5">  schema: database/schema.sql</text><rect x="880" y="320" width="250" height="150" rx="10" fill="#1F1C18" stroke="#6E9887" stroke-width="1.5"/><text x="896" y="346" fill="#6E9887" font-size="14" font-weight="700">Bestanden</text><text x="896" y="370" fill="#F5F1EA" font-size="11.5">backend/uploads/</text><text x="896" y="388" fill="#8A8378" font-size="11.5">  foto's van posts, stories</text><text x="896" y="406" fill="#8A8378" font-size="11.5">  en profielfoto's</text><text x="896" y="424" fill="#8A8378" font-size="11.5">  .htaccess: geen scripts</text><rect x="470" y="450" width="320" height="170" rx="10" fill="#1F1C18" stroke="#8C7BC4" stroke-width="1.5" stroke-dasharray="6 4"/><text x="486" y="476" fill="#8C7BC4" font-size="14" font-weight="700">Tests</text><text x="486" y="500" fill="#F5F1EA" font-size="11.5">tests/e2e/  9 browsertests (Puppeteer)</text><text x="486" y="518" fill="#8A8378" font-size="11.5">  kopie app: /kiekje_testrun/</text><text x="486" y="536" fill="#8A8378" font-size="11.5">  database: kiekje_test, daarna verwijderd</text><text x="486" y="554" fill="#F5F1EA" font-size="11.5">backend/tests/  23 unit tests (PHPUnit)</text><text x="486" y="572" fill="#8A8378" font-size="11.5">  Validator, ImageStorage, Controller, ...</text><path d="M380 170 H470" fill="none" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><rect x="384.72" y="150.5" width="80.56" height="16.5" rx="4" fill="#14120F"/><text x="425" y="162" fill="#8A8378" font-size="10.5" text-anchor="middle">fetch → JSON</text><path d="M470 240 H380" fill="none" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><rect x="381.78" y="222.5" width="86.44000000000001" height="16.5" rx="4" fill="#14120F"/><text x="425" y="234" fill="#8A8378" font-size="10.5" text-anchor="middle">JSON-antwoord</text><rect x="384.72" y="190.5" width="80.56" height="16.5" rx="4" fill="#14120F"/><text x="425" y="202" fill="#8A8378" font-size="10.5" text-anchor="middle">sessiecookie</text><path d="M790 170 H880" fill="none" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><rect x="794.72" y="150.5" width="80.56" height="16.5" rx="4" fill="#14120F"/><text x="835" y="162" fill="#8A8378" font-size="10.5" text-anchor="middle">PDO prepared</text><path d="M790 360 H880" fill="none" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><rect x="794.72" y="340.5" width="80.56" height="16.5" rx="4" fill="#14120F"/><text x="835" y="352" fill="#8A8378" font-size="10.5" text-anchor="middle">ImageStorage</text><path d="M380 440 C 420 440, 420 440, 880 440" fill="none" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><rect x="540.92" y="415.5" width="198.16000000000003" height="16.5" rx="4" fill="#14120F"/><text x="640" y="427" fill="#8A8378" font-size="10.5" text-anchor="middle">&lt;img src=&quot;../backend/uploads/…&quot;&gt;</text><text x="40" y="650" fill="#8A8378" font-size="11.5">De frontend is één pagina (geen herladen): render() tekent het scherm opnieuw uit de toestand in state.js. Alle gegevens komen via de API uit MySQL;</text><text x="40" y="668" fill="#8A8378" font-size="11.5">de server controleert bij elk verzoek de PHP-sessie, zodat je alleen je eigen posts, stories en reacties kunt wijzigen.</text>
</svg>

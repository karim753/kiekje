<svg viewBox="0 0 1000 820" width="1000" height="820" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<title>Use Case Diagram — Kiekje</title>
<defs>
  <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8378"/></marker>
  <marker id="pijl-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker>
  <marker id="erft" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#14120F" stroke="#8A8378" stroke-width="1.2"/></marker>
  <marker id="ruit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,6 L6,1 L12,6 L6,11 z" fill="#1F1C18" stroke="#8A8378"/></marker>
</defs>
<rect width="1000" height="820" fill="#14120F"/>
<text x="30" y="40" fill="#F5F1EA" font-size="22" font-weight="700" font-family="Georgia,serif">Use Case Diagram — Kiekje</text>
<text x="30" y="62" fill="#8A8378" font-size="12.5">Wat een bezoeker en een ingelogde gebruiker kunnen doen</text>
<rect x="200" y="85" width="780" height="690" rx="10" fill="none" stroke="#8A8378" stroke-width="1.5" stroke-dasharray="6 4"/><text x="215" y="108" fill="#8A8378" font-size="13" font-weight="700">Kiekje</text><rect x="230" y="125" width="350" height="260" rx="10" fill="#1A1714" stroke="#4A433A" stroke-width="1.5"/><text x="244" y="147" fill="#E8A33D" font-size="13" font-weight="700">Account</text><ellipse cx="405" cy="177" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="181" fill="#F5F1EA" font-size="12" text-anchor="middle">Registreren</text><ellipse cx="405" cy="221" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="225" fill="#F5F1EA" font-size="12" text-anchor="middle">Inloggen</text><ellipse cx="405" cy="265" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="269" fill="#F5F1EA" font-size="12" text-anchor="middle">Uitloggen</text><ellipse cx="405" cy="309" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="313" fill="#F5F1EA" font-size="12" text-anchor="middle">Profiel bewerken</text><ellipse cx="405" cy="353" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="357" fill="#F5F1EA" font-size="12" text-anchor="middle">Profielfoto wijzigen</text><rect x="600" y="125" width="350" height="304" rx="10" fill="#1A1714" stroke="#4A433A" stroke-width="1.5"/><text x="614" y="147" fill="#E8A33D" font-size="13" font-weight="700">Kiekjes</text><ellipse cx="775" cy="177" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="181" fill="#F5F1EA" font-size="12" text-anchor="middle">Kiekje plaatsen</text><ellipse cx="775" cy="221" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="225" fill="#F5F1EA" font-size="12" text-anchor="middle">Post bewerken / verwijderen</text><ellipse cx="775" cy="265" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="269" fill="#F5F1EA" font-size="12" text-anchor="middle">Liken (ook dubbelklik)</text><ellipse cx="775" cy="309" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="313" fill="#F5F1EA" font-size="12" text-anchor="middle">Reageren</text><ellipse cx="775" cy="353" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="357" fill="#F5F1EA" font-size="12" text-anchor="middle">Reactie liken / verwijderen</text><ellipse cx="775" cy="397" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="401" fill="#F5F1EA" font-size="12" text-anchor="middle">Post delen (link)</text><rect x="230" y="450" width="350" height="216" rx="10" fill="#1A1714" stroke="#4A433A" stroke-width="1.5"/><text x="244" y="472" fill="#E8A33D" font-size="13" font-weight="700">Stories</text><ellipse cx="405" cy="502" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="506" fill="#F5F1EA" font-size="12" text-anchor="middle">Story plaatsen</text><ellipse cx="405" cy="546" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="550" fill="#F5F1EA" font-size="12" text-anchor="middle">Story bekijken</text><ellipse cx="405" cy="590" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="594" fill="#F5F1EA" font-size="12" text-anchor="middle">Story liken</text><ellipse cx="405" cy="634" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="405" y="638" fill="#F5F1EA" font-size="12" text-anchor="middle">Reageren op story (DM)</text><rect x="600" y="450" width="350" height="216" rx="10" fill="#1A1714" stroke="#4A433A" stroke-width="1.5"/><text x="614" y="472" fill="#E8A33D" font-size="13" font-weight="700">Sociaal</text><ellipse cx="775" cy="502" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="506" fill="#F5F1EA" font-size="12" text-anchor="middle">Gebruiker zoeken</text><ellipse cx="775" cy="546" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="550" fill="#F5F1EA" font-size="12" text-anchor="middle">Volgen / ontvolgen</text><ellipse cx="775" cy="590" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="594" fill="#F5F1EA" font-size="12" text-anchor="middle">DM sturen en lezen</text><ellipse cx="775" cy="634" rx="150" ry="17" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.4"/><text x="775" y="638" fill="#F5F1EA" font-size="12" text-anchor="middle">Meldingen bekijken</text><g stroke="#F5F1EA" stroke-width="1.6" fill="none"><circle cx="90" cy="150" r="11"/><line x1="90" y1="161" x2="90" y2="192"/><line x1="72" y1="172" x2="108" y2="172"/><line x1="90" y1="192" x2="76" y2="214"/><line x1="90" y1="192" x2="104" y2="214"/></g><text x="90" y="234" fill="#F5F1EA" font-size="13" font-weight="700" text-anchor="middle">Bezoeker</text><g stroke="#F5F1EA" stroke-width="1.6" fill="none"><circle cx="90" cy="470" r="11"/><line x1="90" y1="481" x2="90" y2="512"/><line x1="72" y1="492" x2="108" y2="492"/><line x1="90" y1="512" x2="76" y2="534"/><line x1="90" y1="512" x2="104" y2="534"/></g><text x="90" y="554" fill="#F5F1EA" font-size="13" font-weight="700" text-anchor="middle">Gebruiker</text><line x1="110" y1="184.08540925266905" x2="230" y2="160.59786476868328" stroke="#8A8378" stroke-width="1.4"/><line x1="110" y1="190.63345195729536" x2="230" y2="206.4341637010676" stroke="#8A8378" stroke-width="1.4"/><path d="M112 505 H150 V440 H590" fill="none" stroke="#8A8378" stroke-width="1.4"/><path d="M215 440 V255 H228" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M215 440 V558 H228" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M590 440 V277 H598" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M590 440 V558 H598" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><path d="M90 250 V 450" fill="none" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><rect x="52.66" y="345.5" width="74.68" height="16.5" rx="4" fill="#14120F"/><text x="90" y="357" fill="#8A8378" font-size="10.5" text-anchor="middle">na inloggen</text><text x="200" y="800" fill="#8A8378" font-size="11.5">Bezoeker: registreren en inloggen. Gebruiker (ingelogd): alle andere use cases; die vereisen «include» Inloggen (de server controleert de sessie).</text>
</svg>

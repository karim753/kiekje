<svg viewBox="0 0 1060 980" width="1060" height="980" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica,Arial,sans-serif">
<title>Sequentiediagram — Een DM sturen</title>
<defs>
  <marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8378"/></marker>
  <marker id="pijl-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"/></marker>
  <marker id="erft" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#14120F" stroke="#8A8378" stroke-width="1.2"/></marker>
  <marker id="ruit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,6 L6,1 L12,6 L6,11 z" fill="#1F1C18" stroke="#8A8378"/></marker>
</defs>
<rect width="1060" height="980" fill="#14120F"/>
<text x="30" y="40" fill="#F5F1EA" font-size="22" font-weight="700" font-family="Georgia,serif">Sequentiediagram — Een DM sturen</text>
<text x="30" y="62" fill="#8A8378" font-size="12.5">Wat er gebeurt tussen browser, API en database als gebruiker A een bericht naar B stuurt</text>
<rect x="30" y="90" width="160" height="46" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="110" y="117" fill="#F5F1EA" font-size="12.5" font-weight="700" text-anchor="middle">Gebruiker A</text><line x1="110" y1="136" x2="110" y2="960" stroke="#4A433A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="250" y="90" width="160" height="46" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="330" y="110" fill="#F5F1EA" font-size="12.5" font-weight="700" text-anchor="middle">Browser A</text><text x="330" y="124" fill="#F5F1EA" font-size="11" text-anchor="middle">(messages.js)</text><line x1="330" y1="136" x2="330" y2="960" stroke="#4A433A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="480" y="90" width="160" height="46" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="560" y="110" fill="#F5F1EA" font-size="12.5" font-weight="700" text-anchor="middle">MessageController</text><text x="560" y="124" fill="#F5F1EA" font-size="11" text-anchor="middle">(api/messages.php)</text><line x1="560" y1="136" x2="560" y2="960" stroke="#4A433A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="690" y="90" width="160" height="46" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="770" y="117" fill="#F5F1EA" font-size="12.5" font-weight="700" text-anchor="middle">MySQL</text><line x1="770" y1="136" x2="770" y2="960" stroke="#4A433A" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="870" y="90" width="160" height="46" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="950" y="117" fill="#F5F1EA" font-size="12.5" font-weight="700" text-anchor="middle">Browser B</text><line x1="950" y1="136" x2="950" y2="960" stroke="#4A433A" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="110" y1="170" x2="327" y2="170" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="220" y="163" fill="#F5F1EA" font-size="11.5" text-anchor="middle">opent gesprek met B</text><line x1="330" y1="214" x2="557" y2="214" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="445" y="207" fill="#F5F1EA" font-size="11.5" text-anchor="middle">GET ?action=list&amp;user=B  (sessiecookie)</text><line x1="560" y1="258" x2="767" y2="258" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="665" y="251" fill="#F5F1EA" font-size="11.5" text-anchor="middle">UPDATE read_at (berichten van B → A gelezen)</text><line x1="560" y1="302" x2="767" y2="302" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="665" y="295" fill="#F5F1EA" font-size="11.5" text-anchor="middle">SELECT berichten A ↔ B</text><line x1="770" y1="346" x2="563" y2="346" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="665" y="339" fill="#8A8378" font-size="11.5" text-anchor="middle">rijen</text><line x1="560" y1="390" x2="333" y2="390" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="445" y="383" fill="#8A8378" font-size="11.5" text-anchor="middle">JSON { messages, me }</text><line x1="330" y1="434" x2="113" y2="434" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="220" y="427" fill="#8A8378" font-size="11.5" text-anchor="middle">gesprek met namen, tijden, &quot;Gezien&quot;</text><line x1="110" y1="490" x2="327" y2="490" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="220" y="483" fill="#F5F1EA" font-size="11.5" text-anchor="middle">typt bericht + Enter</text><line x1="330" y1="534" x2="557" y2="534" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="445" y="527" fill="#F5F1EA" font-size="11.5" text-anchor="middle">POST ?action=send { recipient: B, text }</text><rect x="520" y="560" width="330" height="28" rx="4" fill="#1A1714" stroke="#8C7BC4" stroke-width="1.5"/><text x="530" y="579" fill="#F5F1EA" font-size="11">controle: ingelogd, ontvanger bestaat, niet jezelf, ≤ 2000 tekens</text><line x1="560" y1="620" x2="767" y2="620" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="665" y="613" fill="#F5F1EA" font-size="11.5" text-anchor="middle">INSERT INTO messages (prepared statement)</text><line x1="560" y1="664" x2="333" y2="664" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="445" y="657" fill="#8A8378" font-size="11.5" text-anchor="middle">{ success: true }</text><line x1="330" y1="708" x2="557" y2="708" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="445" y="701" fill="#F5F1EA" font-size="11.5" text-anchor="middle">GET ?action=list  (gesprek verversen)</text><rect x="790" y="746" width="250" height="42" rx="4" fill="#1A1714" stroke="#6E9887" stroke-width="1.5"/><text x="800" y="763" fill="#6E9887" font-size="11">Browser B ververst automatisch:</text><text x="800" y="779" fill="#6E9887" font-size="11">badge elke 15 s, open gesprek elke 4 s</text><line x1="950" y1="816" x2="563" y2="816" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="755" y="809" fill="#F5F1EA" font-size="11.5" text-anchor="middle">GET ?action=unread → badge &quot;1&quot;</text><line x1="950" y1="846" x2="563" y2="846" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="755" y="839" fill="#F5F1EA" font-size="11.5" text-anchor="middle">GET ?action=list → read_at gezet</text><line x1="330" y1="896" x2="557" y2="896" stroke="#E8A33D" stroke-width="1.4" marker-end="url(#pijl-accent)"/><text x="445" y="889" fill="#F5F1EA" font-size="11.5" text-anchor="middle">volgende verversing (elke 4 s)</text><line x1="560" y1="940" x2="333" y2="940" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="445" y="933" fill="#8A8378" font-size="11.5" text-anchor="middle">bericht staat op &quot;Gezien&quot;</text>
</svg>

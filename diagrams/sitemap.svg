<rect x="460" y="90" width="200" height="36" rx="8" fill="#E8A33D" stroke="#E8A33D" stroke-width="1.5"/><text x="560" y="113" fill="#14120F" font-size="12" font-weight="700" text-anchor="middle">frontend/index.html</text><rect x="115" y="180" width="130" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="180" y="203" fill="#F5F1EA" font-size="12" text-anchor="middle">Niet ingelogd</text><rect x="635" y="180" width="130" height="36" rx="8" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><text x="700" y="203" fill="#F5F1EA" font-size="12" text-anchor="middle">Ingelogd (app)</text><path d="M560 126 V153 H180 V180" fill="none" stroke="#8A8378" stroke-width="1.4"/><path d="M560 126 V153 H700 V180" fill="none" stroke="#8A8378" stroke-width="1.4"/><rect x="45" y="245" width="130" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="110" y="268" fill="#F5F1EA" font-size="12" text-anchor="middle">Inloggen</text><rect x="195" y="245" width="130" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="260" y="268" fill="#F5F1EA" font-size="12" text-anchor="middle">Registreren</text><path d="M180 216 V230.5 H110 V245" fill="none" stroke="#8A8378" stroke-width="1.4"/><path d="M180 216 V230.5 H260 V245" fill="none" stroke="#8A8378" stroke-width="1.4"/><rect x="75" y="385" width="150" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="150" y="408" fill="#F5F1EA" font-size="12" text-anchor="middle">Home (feed)</text><path d="M700 216 V300.5 H150 V385" fill="none" stroke="#8A8378" stroke-width="1.4"/><text x="84" y="454" fill="#8A8378" font-size="11.5">· Stories-balk</text><text x="84" y="484" fill="#8A8378" font-size="11.5">· Story bekijken</text><text x="84" y="514" fill="#8A8378" font-size="11.5">· Postkaarten</text><text x="84" y="544" fill="#8A8378" font-size="11.5">· Reactievenster</text><text x="84" y="574" fill="#8A8378" font-size="11.5">· Post-venster (#post-id)</text><rect x="250" y="385" width="150" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="325" y="408" fill="#F5F1EA" font-size="12" text-anchor="middle">Zoeken</text><path d="M700 216 V300.5 H325 V385" fill="none" stroke="#8A8378" stroke-width="1.4"/><text x="259" y="454" fill="#8A8378" font-size="11.5">· React-zoekpagina</text><text x="259" y="484" fill="#8A8378" font-size="11.5">· Profiel openen</text><rect x="425" y="385" width="150" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="500" y="408" fill="#F5F1EA" font-size="12" text-anchor="middle">Berichten</text><path d="M700 216 V300.5 H500 V385" fill="none" stroke="#8A8378" stroke-width="1.4"/><text x="434" y="454" fill="#8A8378" font-size="11.5">· Inbox</text><text x="434" y="484" fill="#8A8378" font-size="11.5">· Gesprek (DM)</text><rect x="600" y="385" width="150" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="675" y="408" fill="#F5F1EA" font-size="12" text-anchor="middle">Meldingen</text><path d="M700 216 V300.5 H675 V385" fill="none" stroke="#8A8378" stroke-width="1.4"/><text x="609" y="454" fill="#8A8378" font-size="11.5">· Nieuw / Vandaag /</text><text x="609" y="484" fill="#8A8378" font-size="11.5">· Deze week / Eerder</text><text x="609" y="514" fill="#8A8378" font-size="11.5">· Terugvolgen</text><rect x="775" y="385" width="150" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="850" y="408" fill="#F5F1EA" font-size="12" text-anchor="middle">Maken</text><path d="M700 216 V300.5 H850 V385" fill="none" stroke="#8A8378" stroke-width="1.4"/><text x="784" y="454" fill="#8A8378" font-size="11.5">· Venster</text><text x="784" y="484" fill="#8A8378" font-size="11.5">· &quot;Nieuw kiekje&quot;</text><rect x="950" y="385" width="150" height="36" rx="8" fill="#1F1C18" stroke="#E8A33D" stroke-width="1.5"/><text x="1025" y="408" fill="#F5F1EA" font-size="12" text-anchor="middle">Profiel</text><path d="M700 216 V300.5 H1025 V385" fill="none" stroke="#8A8378" stroke-width="1.4"/><text x="959" y="454" fill="#8A8378" font-size="11.5">· Eigen: bewerken,</text><text x="959" y="484" fill="#8A8378" font-size="11.5">· profielfoto (bijsnijden)</text><text x="959" y="514" fill="#8A8378" font-size="11.5">· Ander: volgen, bericht</text><text x="959" y="544" fill="#8A8378" font-size="11.5">· Volgers / volgend</text><text x="40" y="640" fill="#8A8378" font-size="11.5">Kiekje is een single-page app: er zijn geen losse pagina-adressen. Schermen wisselen via de menuknoppen (zijbalk op groot scherm, onderbalk op telefoon);</text><text x="40" y="658" fill="#8A8378" font-size="11.5">alleen een gedeelde post heeft een eigen link (index.html#post-12). Vensters (post, reacties, story, DM, bewerken) openen boven het huidige scherm.</text>

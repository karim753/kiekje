<text x="30" y="40" fill="#F5F1EA" font-size="22" font-weight="700" font-family="Georgia,serif">Klassendiagram — Kiekje backend</text>
<text x="30" y="62" fill="#8A8378" font-size="12.5">De echte PHP-klassen in backend/src/: overerving (Controller, Repository), encapsulatie en hergebruik (LikeTable)</text>
<text x="30" y="92" fill="#6E9887" font-size="13" font-weight="700">Core  (backend/src/Core/)</text><rect x="30" y="104" width="182" height="111" rx="4" fill="#1F1C18" stroke="#6E9887" stroke-width="1.5"/><rect x="30" y="104" width="182" height="24" rx="4" fill="#6E9887"/><text x="121" y="121" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">Request</text><text x="39" y="144" fill="#E8A33D" font-size="10.8">+ method(): string</text><text x="39" y="159" fill="#E8A33D" font-size="10.8">+ action(): string</text><text x="39" y="174" fill="#E8A33D" font-size="10.8">+ query(key)</text><text x="39" y="189" fill="#E8A33D" font-size="10.8">+ input(key)</text><text x="39" y="204" fill="#E8A33D" font-size="10.8">+ text(key)</text><rect x="224" y="104" width="182" height="66" rx="4" fill="#1F1C18" stroke="#6E9887" stroke-width="1.5"/><rect x="224" y="104" width="182" height="24" rx="4" fill="#6E9887"/><text x="315" y="121" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">Response</text><text x="233" y="144" fill="#E8A33D" font-size="10.8">+ json(data, status) «static»</text><text x="233" y="159" fill="#E8A33D" font-size="10.8">+ error(msg, status) «static»</text><rect x="418" y="104" width="182" height="81" rx="4" fill="#1F1C18" stroke="#6E9887" stroke-width="1.5"/><rect x="418" y="104" width="182" height="24" rx="4" fill="#6E9887"/><text x="509" y="121" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">Session</text><text x="427" y="144" fill="#E8A33D" font-size="10.8">+ userId(): ?int</text><text x="427" y="159" fill="#E8A33D" font-size="10.8">+ login(id)</text><text x="427" y="174" fill="#E8A33D" font-size="10.8">+ logout()</text><rect x="612" y="104" width="182" height="66" rx="4" fill="#1F1C18" stroke="#6E9887" stroke-width="1.5"/><rect x="612" y="104" width="182" height="24" rx="4" fill="#6E9887"/><text x="703" y="121" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">Database</text><tex
t x="880" y="890" width="470" height="51" rx="4" fill="#1F1C18" stroke="#8C7BC4" stroke-width="1.5"/><rect x="880" y="890" width="470" height="24" rx="4" fill="#8C7BC4"/><text x="1115" y="907" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">MessageRepository</text><text x="889" y="930" fill="#E8A33D" font-size="10.8">+ conversations()  + thread()  + markRead()  + send()</text><rect x="880" y="956" width="470" height="51" rx="4" fill="#1F1C18" stroke="#8C7BC4" stroke-width="1.5"/><rect x="880" y="956" width="470" height="24" rx="4" fill="#8C7BC4"/><text x="1115" y="973" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">NotificationRepository</text><text x="889" y="996" fill="#E8A33D" font-size="10.8">+ forUser(): array</text><rect x="880" y="1022" width="470" height="51" rx="4" fill="#1F1C18" stroke="#8C7BC4" stroke-width="1.5"/><rect x="880" y="1022" width="470" height="24" rx="4" fill="#8C7BC4"/><text x="1115" y="1039" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle">LikeTable</text><text x="889" y="1062" fill="#E8A33D" font-size="10.8">- table   + toggle(item, user)   + count(item)</text><path d="M90 1043 V497 H260 V480" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#erft)"/><line x1="90" y1="581" x2="120" y2="581" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="647" x2="120" y2="647" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="713" x2="120" y2="713" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="779" x2="120" y2="779" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="845" x2="120" y2="845" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="911" x2="120" y2="911" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="977" x2="120" y2="977" stroke="#8A8378" stroke-width="1.4"/><line x1="90" y1="1043" x2="120" y2="1043" stroke="#8A8378" stroke-width="1.4"/><path d="M850 1043 V422 H1010 V405" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#erft)"/><line x1="850" y1="581" x2="880" y2="581" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="647" x2="880" y2="647" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="713" x2="880" y2="713" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="779" x2="880" y2="779" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="845" x2="880" y2="845" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="911" x2="880" y2="911" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="977" x2="880" y2="977" stroke="#8A8378" stroke-width="1.4"/><line x1="850" y1="1043" x2="880" y2="1043" stroke="#8A8378" stroke-width="1.4"/><line x1="100" y1="300" x2="121" y2="215" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><line x1="210" y1="300" x2="315" y2="170" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><line x1="380" y1="300" x2="509" y2="185" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><line x1="440" y1="300" x2="897" y2="185" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><line x1="880" y1="300" x2="703" y2="170" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><rect x="778.1" y="226" width="26.8" height="16" rx="4" fill="#14120F"/><text x="791.5" y="237" fill="#8A8378" font-size="10" text-anchor="middle">PDO</text><line x1="590" y1="647" x2="880" y2="647" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><rect x="707.6" y="638" width="54.800000000000004" height="16" rx="4" fill="#14120F"/><text x="735" y="649" fill="#8A8378" font-size="10" text-anchor="middle">gebruikt</text><line x1="590" y1="713" x2="880" y2="1043" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="620" y="540" fill="#8A8378" font-size="10.5" text-anchor="middle">Controllers gebruiken repositories (bv. PostController → PostRepository, InteractionController → LikeTable)</text><path d="M30 1108 h28" stroke="#8A8378" stroke-width="1.4" marker-end="url(#erft)"/><text x="66" y="1112" fill="#8A8378" font-size="11">erft van (extends)</text><path d="M220 1108 h28" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#pijl)"/><text x="256" y="1112" fill="#8A8378" font-size="11">gebruikt</text><text x="340" y="1112" fill="#8A8378" font-size="11">+ public   # protected   - private   cursief = abstract   «static» = klassemethode</text><text x="30" y="1134" fill="#8A8378" font-size="11">Elk bestand in backend/api/ start alleen zijn controller: (new PostController())-&gt;run(). Klassen worden automatisch geladen via backend/bootstrap.php (namespace Kiekje\).</text>

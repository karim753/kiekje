700" text-anchor="middle" font-style="italic">Controller</text><text x="260" y="295" fill="#8A8378" font-size="10" text-anchor="middle">«abstract»</text><text x="454" y="473" fill="#8A8378" font-size="9.5" text-anchor="end">src/Controllers/Controller.php</text><text x="69" y="340" fill="#F5F1EA" font-size="10.8"># request: Request</text><text x="69" y="355" fill="#F5F1EA" font-size="10.8"># session: Session</text><text x="69" y="370" fill="#F5F1EA" font-size="10.8">- user: ?array</text><line x1="60" y1="377" x2="460" y2="377" stroke="#4A433A" stroke-width="1"/><text x="69" y="393" fill="#E8A33D" font-size="10.8">+ run()</text><text x="69" y="408" fill="#E8A33D" font-size="10.8" font-style="italic"># handle() {abstract}</text><text x="69" y="423" fill="#E8A33D" font-size="10.8"># currentUser(): array</text><text x="69" y="438" fill="#E8A33D" font-size="10.8"># dispatch(routes, action)</text><text x="69" y="453" fill="#E8A33D" font-size="10.8"># ok(data)</text><text x="69" y="468" fill="#E8A33D" font-size="10.8"># db(): PDO   # images(): ImageStorage</text><rect x="820" y="300" width="380" height="104" rx="4" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><rect x="820" y="300" width="380" height="24" rx="4" fill="#D9667A"/><text x="1010" y="317" fill="#14120F" font-size="12.5" font-weight="700" text-anchor="middle" font-style="italic">Repository</text><text x="1010" y="295" fill="#8A8378" font-size="10" text-anchor="middle">«abstract»</text><text x="1194" y="398" fill="#8A8378" font-size="9.5" text-anchor="end">src/Repositories/Repository.php</text><text x="829" y="340" fill="#F5F1EA" font-size="10.8"># pdo: PDO</text><line x1="820" y1="347" x2="1200" y2="347" stroke="#4A433A" stroke-width="1"/><text x="829" y="363" fill="#E8A33D" font-size="10.8"># run(sql, params): PDOStatement</text><text x="829" y="378" fill="#E8A33D" font-size="10.8"># one()   # all()   # value()   # column()</text><text x="829" y="393" fill="#E8A33D" font-size="10.8"># lastId(): int</text><
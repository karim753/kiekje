<rect width="990" height="730" fill="#14120F"/>
<text x="30" y="40" fill="#F5F1EA" font-size="22" font-weight="700" font-family="Georgia,serif">Domeinmodel — Kiekje</text>
<text x="30" y="62" fill="#8A8378" font-size="12.5">Conceptueel: de begrippen van de app, hun gegevens, handelingen en relaties</text>
<rect x="385" y="95" width="230" height="238" rx="4" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><rect x="385" y="95" width="230" height="26" rx="4" fill="#D9667A"/><text x="500" y="113" fill="#14120F" font-size="13" font-weight="700" text-anchor="middle">User</text><text x="395" y="139" fill="#F5F1EA" font-size="11">- id: int</text><text x="395" y="155" fill="#F5F1EA" font-size="11">- username: string</text><text x="395" y="171" fill="#F5F1EA" font-size="11">- email: string</text><text x="395" y="187" fill="#F5F1EA" font-size="11">- passwordHash: string</text><text x="395" y="203" fill="#F5F1EA" font-size="11">- bio: string</text><text x="395" y="219" fill="#F5F1EA" font-size="11">- avatarUrl: string</text><line x1="385" y1="223" x2="615" y2="223" stroke="#4A433A" stroke-width="1"/><text x="395" y="241" fill="#E8A33D" font-size="11">+ register(): bool</text><text x="395" y="257" fill="#E8A33D" font-size="11">+ login(identifier, pw): bool</text><text x="395" y="273" fill="#E8A33D" font-size="11">+ logout()</text><text x="395" y="289" fill="#E8A33D" font-size="11">+ updateProfile(naam, bio)</text><text x="395" y="305" fill="#E8A33D" font-size="11">+ updateAvatar(foto)</text><text x="395" y="321" fill="#E8A33D" font-size="11">+ follow(user: User)</text><rect x="30" y="95" width="235" height="206" rx="4" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><rect x="30" y="95" width="235" height="26" rx="4" fill="#D9667A"/><text x="147.5" y="113" fill="#14120F" font-size="13" font-weight="700" text-anchor="middle">Post</text><text x="40" y="139" fill="#F5F1EA" font-size="11">- id: int</text><text x="40" y="155" fill="#F5F1EA" font-size="11">- imageUrl: string</text><text x="40" y="171" fill="#F5F1EA" font-size="11">- caption: string</text><text x="40" y="187" fill="#F5F1EA" font-size="11">- location: string</text><text x="40" y="203" fill="#F5F1EA" font-size="11">- createdAt: datetime</text><line x1="30" y1="207" x2="265" y2="207" stroke="#4A433A" stroke-width="1"/><text x="40" y="225" fill="#E8A33D" font-size="11">+ create(foto, caption)</text><text x="40" y="241" fill="#E8A33D" font-size="11">+ updateCaption(tekst)</text><text x="40" y="257" fill="#E8A33D" font-size="11">+ delete()</text><text x="40" y="273" fill="#E8A33D" font-size="11">+ toggleLike(user): bool</text><text x="40" y="289" fill="#E8A33D" font-size="11">+ addComment(user, tekst)</text><rect x="30" y="440" width="235" height="126" rx="4" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><rect x="30" y="440" width="235" height="26" rx="4" fill="#D9667A"/><text x="147.5" y="458" fill="#14120F" font-size="13" font-weight="700" text-anchor="middle">Comment</text><text x="40" y="484" fill="#F5F1EA" font-size="11">- id: int</text><text x="40" y="500" fill="#F5F1EA" font-size="11">- content: string</text><text x="40" y="516" fill="#F5F1EA" font-size="11">- createdAt: datetime</text><line x1="30" y1="520" x2="265" y2="520" stroke="#4A433A" stroke-width="1"/><text x="40" y="538" fill="#E8A33D" font-size="11">+ toggleLike(user): bool</text><text x="40" y="554" fill="#E8A33D" font-size="11">+ delete(door: User)</text><rect x="735" y="95" width="225" height="158" rx="4" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><rect x="735" y="95" width="225" height="26" rx="4" fill="#D9667A"/><text x="847.5" y="113" fill="#14120F" font-size="13" font-weight="700" text-anchor="middle">Story</text><text x="745" y="139" fill="#F5F1EA" font-size="11">- id: int</text><text x="745" y="155" fill="#F5F1EA" font-size="11">- imageUrl: string</text><text x="745" y="171" fill="#F5F1EA" font-size="11">- createdAt: datetime</text><line x1="735" y1="175" x2="960" y2="175" stroke="#4A433A" stroke-width="1"/><text x="745" y="193" fill="#E8A33D" font-size="11">+ create(foto)</text><text x="745" y="209" fill="#E8A33D" font-size="11">+ isActief(): bool  (&lt; 24 uur)</text><text x="745" y="225" fill="#E8A33D" font-size="11">+ toggleLike(user): bool</text><text x="745" y="241" fill="#E8A33D" font-size="11">+ delete()</text><rect x="735" y="380" width="225" height="142" rx="4" fill="#1F1C18" stroke="#D9667A" stroke-width="1.5"/><rect x="735" y="380" width="225" height="26" rx="4" fill="#D9667A"/><text x="847.5" y="398" fill="#14120F" font-size="13" font-weight="700" text-anchor="middle">Message</text><text x="745" y="424" fill="#F5F1EA" font-size="11">- id: int</text><text x="745" y="440" fill="#F5F1EA" font-size="11">- text: string</text><text x="745" y="456" fill="#F5F1EA" font-size="11">- createdAt: datetime</text><text x="745" y="472" fill="#F5F1EA" font-size="11">- readAt: datetime?</text><line x1="735" y1="476" x2="960" y2="476" stroke="#4A433A" stroke-width="1"/><text x="745" y="494" fill="#E8A33D" font-size="11">+ send(van, naar, tekst)</text><text x="745" y="510" fill="#E8A33D" font-size="11">+ markeerGelezen()</text><rect x="385" y="475" width="230" height="126" rx="4" fill="#1F1C18" stroke="#8C7BC4" stroke-width="1.5"/><rect x="385" y="475" width="230" height="26" rx="4" fill="#8C7BC4"/><text x="500" y="469" fill="#8A8378" font-size="10.5" text-anchor="middle">«afgeleid, geen tabel»</text><text x="500" y="493" fill="#14120F" font-size="13" font-weight="700" text-anchor="middle">Melding</text><text x="395" y="519" fill="#F5F1EA" font-size="11">- type: like | comment | follow |</text><text x="395" y="535" fill="#F5F1EA" font-size="11">        story_like | comment_like</text><text x="395" y="551" fill="#F5F1EA" font-size="11">- actor: User</text><text x="395" y="567" fill="#F5F1EA" font-size="11">- createdAt: datetime</text><line x1="385" y1="571" x2="615" y2="571" stroke="#4A433A" stroke-width="1"/><text x="395" y="589" fill="#E8A33D" font-size="11">+ lijstVoor(user): Melding[]</text><line x1="385" y1="208.78014184397162" x2="265" y2="203.33333333333334" stroke="#8A8378" stroke-width="1.4"/><rect x="275.9" y="186.55673758865248" width="98.2" height="16.5" rx="4" fill="#14120F"/><text x="325" y="198.05673758865248" fill="#8A8378" font-size="10.5" text-anchor="middle">plaatst  1 .. *</text><line x1="147.5" y1="301" x2="147.5" y2="440" stroke="#8A8378" stroke-width="1.4"/><rect x="104.28" y="361" width="86.44000000000001" height="16.5" rx="4" fill="#14120F"/><text x="147.5" y="372.5" fill="#8A8378" font-size="10.5" text-anchor="middle">heeft  1 .. *</text><line x1="385" y1="308.2836879432624" x2="224.34256055363323" y2="440" stroke="#8A8378" stroke-width="1.4"/><rect x="252.6312802768166" y="370.6418439716312" width="104.08000000000001" height="16.5" rx="4" fill="#14120F"/><text x="304.6712802768166" y="382.1418439716312" fill="#8A8378" font-size="10.5" text-anchor="middle">schrijft  1 .. *</text><line x1="615" y1="200.76258992805757" x2="735" y2="186.9496402877698" stroke="#8A8378" stroke-width="1.4"/><rect x="625.9" y="174.3561151079137" width="98.2" height="16.5" rx="4" fill="#14120F"/><text x="675" y="185.8561151079137" fill="#8A8378" font-size="10.5" text-anchor="middle">plaatst  1 .. *</text><line x1="615" y1="292.431654676259" x2="743.3966244725739" y2="380" stroke="#8A8378" stroke-width="1.4"/><rect x="606.5783122362869" y="326.7158273381295" width="145.24" height="16.5" rx="4" fill="#14120F"/><text x="679.1983122362869" y="338.2158273381295" fill="#8A8378" font-size="10.5" text-anchor="middle">stuurt/ontvangt  1 .. *</text><line x1="500" y1="333" x2="500" y2="475" stroke="#8A8378" stroke-width="1.4" stroke-dasharray="5 4"/><rect x="477.36" y="394.5" width="45.28" height="16.5" rx="4" fill="#14120F"/><text x="500" y="406" fill="#8A8378" font-size="10.5" text-anchor="middle">krijgt</text><path d="M445 95 v-28 h130 v28" fill="none" stroke="#8A8378" stroke-width="1.4" marker-end="url(#pijl)"/><rect x="464.96" y="57" width="90.08000000000001" height="17" rx="4" fill="#14120F"/><text x="510" y="69" fill="#8A8378" font-size="11" text-anchor="middle">volgt  * .. *</text><text x="40" y="690" fill="#8A8378" font-size="11.5">Likes (Post, Comment, Story) zijn koppeltabellen tussen User en het item: één like per gebruiker per item.</text><text x="40" y="708" fill="#8A8378" font-size="11.5">Conceptueel model. De echte PHP-klassen staan in klassendiagram.svg (bv. Post.toggleLike → InteractionController::likePost() + LikeTable::toggle()).</text>
</svg>
